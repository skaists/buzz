# Mirror third-party CI images into this org's registry by exact digest.
#
#   upstream image digest → org-controlled mirror digest → compose pin
#
# For each entry in .github/image-mirrors.json:
#   1. Find a source that serves the pinned digest. Content is addressed by
#      digest, so any source serving these exact bytes is acceptable.
#   2. Copy it with `skopeo copy --all --preserve-digests`: the whole
#      multi-arch index, no rebuild or retag of content.
#   3. Verify the mirror: the raw manifest the mirror serves must hash to the
#      same digest, and a pull by digest from the mirror must succeed.
#   4. Emit a provenance record (source used, digest, mirror ref, time, tool
#      version, run URL) as a job summary and an artifact.
#
# This workflow only produces and verifies the mirror. CI is switched to the
# mirror in a separate commit, after a green run of this workflow.

name: Mirror CI images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/image-mirrors.json"
      - ".github/workflows/mirror-images.yml"

permissions: {}

concurrency:
  group: mirror-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror and verify by digest
    # Same-repo only: fork PRs get no package write access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Mirror, verify, record provenance
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u "$REGISTRY_USER" --password-stdin
          owner="${OWNER,,}"
          tool="$(skopeo --version)"
          : > provenance.jsonl
          failed=0

          count="$(jq '.images | length' .github/image-mirrors.json)"
          for i in $(seq 0 $((count - 1))); do
            name="$(jq -r ".images[$i].name" .github/image-mirrors.json)"
            tag="$(jq -r ".images[$i].upstream_tag" .github/image-mirrors.json)"
            digest="$(jq -r ".images[$i].digest" .github/image-mirrors.json)"
            mirror="ghcr.io/${owner}/buzz-ci-mirror/${name}"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$name: malformed digest"; failed=1; continue; }

            used=""
            for src in $(jq -r ".images[$i].sources[]" .github/image-mirrors.json); do
              echo "::group::$name: trying $src@$digest"
              # Hash the bytes as served (piped, so no trailing-newline loss).
              if served="sha256:$(skopeo inspect --raw --retry-times 3 "docker://${src}@${digest}" | sha256sum | cut -d' ' -f1)" \
                 && [ "$served" = "$digest" ]; then
                used="$src"
              else
                echo "$src does not serve $digest"
              fi
              echo "::endgroup::"
              [ -n "$used" ] && break
            done
            if [ -z "$used" ]; then
              echo "::error::$name: no source serves $digest"
              failed=1
              continue
            fi

            skopeo copy --all --preserve-digests --retry-times 3 \
              "docker://${used}@${digest}" "docker://${mirror}:${tag}"

            # Verify what the mirror now serves, independently of the copy.
            by_tag="sha256:$(skopeo inspect --raw "docker://${mirror}:${tag}" | sha256sum | cut -d' ' -f1)"
            by_digest="sha256:$(skopeo inspect --raw "docker://${mirror}@${digest}" | sha256sum | cut -d' ' -f1)"
            if [ "$by_tag" != "$digest" ] || [ "$by_digest" != "$digest" ]; then
              echo "::error::$name: mirror serves $by_tag / $by_digest, expected $digest"
              failed=1
              continue
            fi

            jq -cn \
              --arg name "$name" --arg source "${used}:${tag}@${digest}" \
              --arg digest "$digest" --arg mirror "${mirror}:${tag}@${digest}" \
              --arg copied_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg tool "$tool" \
              --arg run "$RUN_URL" \
              '{name: $name, source: $source, digest: $digest, mirror: $mirror, copied_at: $copied_at, tool: $tool, run: $run}' \
              >> provenance.jsonl
            echo "verified $name: $mirror@$digest"
          done

          {
            echo "### CI image mirror provenance"
            echo '```json'
            cat provenance.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-mirror-provenance
          path: provenance.jsonl
          if-no-files-found: ignore
